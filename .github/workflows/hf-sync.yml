name: CI/CD to Hugging Face Space

on:
  push:
    branches: [ case_study_1_2025 ]
  pull_request:
    branches: [ case_study_1_2025 ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo (for tests)
        uses: actions/checkout@v3
        with:
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        run: |
          pytest

  deploy:
    needs: test
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Checkout repo (for deploy)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git push --force https://gocuretirizarry:$HF_TOKEN@huggingface.co/spaces/gocuretirizarry/Case-study-1_chat case_study_1_2025:main

  notify-success:
    needs: deploy
    runs-on: ubuntu-latest
    if: success()
    steps:
      - name: Discord notification (success)
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ✅ Hugging Face Space *🔮 Talking With Gandalf 🪄* has been successfully synced!
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Run: ${{ github.run_id }}

  notify-failure:
    needs: test
    runs-on: ubuntu-latest
    if: failure()
    steps:
      - name: Discord notification (failure)
        uses: Ilshidur/action-discord@master
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        with:
          args: |
            ❌ Tests failed. Deployment skipped.
            Commit: ${{ github.sha }}
            Author: ${{ github.actor }}
            Workflow: ${{ github.workflow }}